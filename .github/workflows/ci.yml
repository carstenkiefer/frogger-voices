name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check texts and clips
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Consistency
        run: python3 scripts/check.py

  package:
    name: Packages
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-git$(git log -1 --format=%cd --date=format:%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: scripts/build-packages.sh dist
      - name: Inspect
        run: for f in dist/*.deb; do dpkg-deb -I "$f" | head -12; dpkg-deb -c "$f" | head -5; done
      - uses: actions/upload-artifact@v4
        with:
          name: voice-packages
          path: dist/*

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voice-packages
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $pre
